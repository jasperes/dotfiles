[kde.shortcuts]
"kitty.desktop" = { binding = "Ctrl+Alt+T", group = "services" }
"org.kde.konsole.desktop" = { binding = "none", group = "services" }

[kde.theme]
"kdeglobals:General:ColorScheme" = "Dracula"
"kde-gtk-config:GTK:theme" = "Dracula"
"plasmarc:Theme:name" = "Dracula"
"kwinrc:org.kde.kdecoration2:library" = "org.kde.kwin.aurorae"
"kwinrc:org.kde.kdecoration2:theme" = "__aurorae__svg__Dracula"
"kdeglobals:Icons:Theme" = "Dracula"
"kcminputrc:Mouse:cursorTheme" = "Dracula-cursors"
