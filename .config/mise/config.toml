[settings]
dotfiles.root = "~/.dotfiles"
dotfiles.default_mode = "symlink-each"

[dotfiles]
"~/" = { source = "~/.dotfiles", mode = "symlink-each", exclude = ["README.md"] }
# VSCode OSS
"~/.vscode-oss" = { source = "~/.dotfiles/.vscode", mode = "symlink-each" }
"~/.config/Code - OSS/User/settings.json" = { source = "~/.dotfiles/.config/Code/User/settings.json", mode = "symlink" }

[bootstrap.repos]
# Oh My ZSH - Plugins
"~/.oh-my-zsh/custom/plugins/zsh-autocomplete" = { url = "git@github.com:marlonrichert/zsh-autocomplete.git" }
"~/.oh-my-zsh/custom/plugins/zsh-completions" = { url = "git@github.com:zsh-users/zsh-completions.git" }
"~/.oh-my-zsh/custom/plugins/zsh-autosuggestions" = { url = "git@github.com:zsh-users/zsh-autosuggestions.git" }
"~/.oh-my-zsh/custom/plugins/zsh-history-substring-search" = { url = "git@github.com:zsh-users/zsh-history-substring-search.git" }
"~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting" = { url = "git@github.com:zsh-users/zsh-syntax-highlighting.git" }
"~/.oh-my-zsh/custom/plugins/autocomplete" = { url = "git@github.com:TamCore/autoupdate-oh-my-zsh-plugins.git" }
"~/.oh-my-zsh/custom/plugins/zsh-mise" = { url = "git@github.com:wintermi/zsh-mise.git" }
"~/.oh-my-zsh/themes/powerlevel10k" = { url = "git@github.com:romkatv/powerlevel10k.git" }

# Programs
"~/.local/opt/reshade" = { url = "git@github.com:kevinlekiller/reshade-steam-proton.git" }

[bootstrap.packages]
# CachyOS
"pacman:linux-cachyos" = "latest"
"pacman:linux-cachyos-headers" = "latest"
