"pacman:vlc" = "latest"
"pacman:vlc-plugins-all" = "latest"
"pacman:ffmpeg" = "latest"
"pacman:ffmpegthumbs" = "latest"
"pacman:ffmpegthumbnailer" = "latest"
"pacman:git" = "latest"
