[env]
GPU = "nvidia"

[bootstrap.hooks.pre-packages]
run = [
    """ # DEBIAN - Add i386
    {% if env.SYSTEM = 'debian' %}
    dpkg --add-architecture i386
    {% endif %}
    """,
]

[bootstrap.packages]
# Debian
"apt:linux-headers-amd64" = "latest"
"apt:nvidia-kernel-common" = "latest"
"apt:build-essential" = "latest"
"apt:libglvnd-dev" = "latest"
"apt:pkg-config" = "latest"
"apt:libc6:i386" = "latest"

[tasks."distro:setup:gpu"]
run = """ # DEBIAN - Install CUDA
    {% if env.SYSTEM = 'debian' %}
    mkdir -p ~/.temp && cd ~/.temp
    wget https://developer.download.nvidia.com/compute/cuda/repos/debian13/x86_64/cuda-keyring_1.1-1_all.deb
    sudo dpkg -i cuda-keyring_1.1-1_all.deb
    sudo apt update
    sudo apt upgrade
    sudo apt -V install cuda-drivers
    {% endif %}
"""
